<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAIRO Lifestyle — Complete Email System Preview Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #4A2E1D;
      --ink-dark: #2A170C;
      --paper: #FFFFFF;
      --page-bg: #F4EFE6;
      --surface: #F9F6F0;
      --border: #E5DCce;
      --border-dark: #D4C6B3;
      --muted: #7A6F64;
      --accent-gold: #C5A059;
      --accent-light: #FDFBF7;
      --tag-cust: #2D6A4F;
      --tag-admin: #B23A22;
      --tag-aff: #7B2CBF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--page-bg);
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* TOP BRAND BAR */
    header {
      background: var(--ink-dark);
      color: #fff;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--accent-gold);
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-logo {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #fff;
    }
    .brand-pill {
      background: rgba(197, 160, 89, 0.2);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }
    .top-stats {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .top-stats span b {
      color: #fff;
    }

    /* MAIN WORKSPACE */
    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* SIDEBAR */
    aside {
      width: 360px;
      background: #FFFFFF;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .sidebar-header h3 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--ink);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .search-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-dark);
      font-size: 13px;
      outline: none;
      background: #fff;
      font-family: inherit;
    }
    .search-input:focus {
      border-color: var(--ink);
    }
    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .category-group {
      margin-bottom: 18px;
    }
    .cat-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 10px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .email-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .email-item:hover {
      background: var(--surface);
      border-color: var(--border);
    }
    .email-item.active {
      background: #F4EFE6;
      border-color: var(--accent-gold);
      box-shadow: 0 2px 8px rgba(74, 46, 29, 0.08);
    }
    .email-item-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }
    .email-item-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }
    .role-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .role-Customer { background: #E8F5E9; color: var(--tag-cust); border: 1px solid #C8E6C9; }
    .role-Admin { background: #FFEBEE; color: var(--tag-admin); border: 1px solid #FFCDD2; }
    .role-Affiliate { background: #F3E5F5; color: var(--tag-aff); border: 1px solid #E1BEE7; }

    /* PREVIEW CONTAINER */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #EFE9DE;
      overflow: hidden;
    }

    /* PREVIEW META TOOLBAR */
    .meta-toolbar {
      background: #FFFFFF;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .meta-left {
      max-width: 65%;
    }
    .meta-subject {
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .meta-details {
      display: flex;
      gap: 18px;
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .meta-details span b {
      color: var(--ink);
      font-weight: 600;
    }

    .meta-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .device-switcher {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
    }
    .device-btn {
      padding: 6px 12px;
      border: none;
      background: transparent;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .device-btn.active {
      background: #FFFFFF;
      color: var(--ink);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .action-btn {
      padding: 7px 14px;
      border: 1px solid var(--border-dark);
      background: #FFFFFF;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .action-btn:hover {
      background: var(--surface);
      border-color: var(--ink);
    }
    .action-btn.primary {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }
    .action-btn.primary:hover {
      background: var(--ink-dark);
    }

    /* IFRAME STAGE */
    .stage {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #EFE9DE;
    }
    .iframe-wrapper {
      transition: width 0.25s ease;
      background: #FFFFFF;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(74, 46, 29, 0.12), 0 2px 6px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      height: 100%;
      min-height: 720px;
      display: flex;
      flex-direction: column;
    }
    .iframe-wrapper.desktop { width: 680px; }
    .iframe-wrapper.mobile { width: 390px; }
    .iframe-wrapper.full { width: 100%; max-width: 960px; }

    iframe {
      width: 100%;
      height: 100%;
      min-height: 720px;
      border: none;
      background: var(--page-bg);
      flex: 1;
    }

    /* RAW CODE MODAL / VIEW */
    .code-view {
      display: none;
      width: 100%;
      max-width: 900px;
      height: 100%;
      background: #1E1E1E;
      color: #E0E0E0;
      border-radius: 12px;
      padding: 20px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      overflow: auto;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid #333;
    }

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--ink-dark);
      color: #FFFFFF;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }
    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand-wrap">
      <div class="brand-logo">PAIRO</div>
      <div class="brand-pill">Email System Suite &middot; 20 Templates</div>
    </div>
    <div class="top-stats">
      <span>Total Templates: <b>20</b></span>
      <span>Palette: <b style="color:var(--accent-gold);">Ink (#4A2E1D) &middot; Sand (#F3EFE7)</b></span>
      <span>Brand Standard: <b>RFC Compliant Shell</b></span>
    </div>
  </header>

  <!-- BODY -->
  <div class="app-body">
    <!-- SIDEBAR -->
    <aside>
      <div class="sidebar-header">
        <h3>Email Templates</h3>
        <input type="text" id="search" class="search-input" placeholder="Filter by name, customer, subject..." oninput="filterEmails()">
      </div>
      <div class="sidebar-scroll" id="sidebar-list">
        <!-- Rendered by JS -->
      </div>
    </aside>

    <!-- PREVIEW AREA -->
    <main>
      <div class="meta-toolbar">
        <div class="meta-left">
          <div class="meta-subject" id="disp-subject">Loading Subject...</div>
          <div class="meta-details">
            <span>To: <b id="disp-to">-</b></span>
            <span>From: <b id="disp-from">-</b></span>
            <span>Trigger: <b id="disp-trigger">-</b></span>
          </div>
        </div>
        <div class="meta-right">
          <div class="device-switcher">
            <button class="device-btn active" id="btn-desktop" onclick="setDevice('desktop')">Desktop (680px)</button>
            <button class="device-btn" id="btn-mobile" onclick="setDevice('mobile')">Mobile (390px)</button>
            <button class="device-btn" id="btn-full" onclick="setDevice('full')">Full View</button>
          </div>
          <button class="action-btn" id="btn-toggle-code" onclick="toggleCodeView()">View HTML</button>
          <button class="action-btn" onclick="copyCurrentHtml()">Copy HTML</button>
          <a class="action-btn primary" id="btn-open-tab" href="#" target="_blank">Open in New Tab &nearr;</a>
        </div>
      </div>

      <div class="stage">
        <div class="iframe-wrapper desktop" id="iframe-wrap">
          <iframe id="preview-frame" src=""></iframe>
        </div>
        <pre class="code-view" id="code-view"></pre>
      </div>
    </main>
  </div>

  <div id="toast">Copied to clipboard!</div>

der-top:1px solid #E3DACB;padding:26px 40px;text-align:center;\">\n    <p style=\"margin:0;color:#4A2E1D;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;\">PAIRO Lifestyle</p>\n    <p style=\"margin:8px 0 0;color:#9C9388;font-size:11px;\">&copy; 2026 PAIRO Lifestyle &middot; <a href=\"https://pairolifestyle.com\" style=\"color:#9C9388;text-decoration:underline;\">pairolifestyle.com</a></p>\n  </td></tr>\n</table>\n</td></tr>\n</table>\n</body>\n</html>"}];
    let currentId = emailsData[0].id;
    let isCodeMode = false;

    function renderSidebar(filtered = emailsData) {
      const container = document.getElementById('sidebar-list');
      container.innerHTML = '';

      const cats = Array.from(new Set(filtered.map(e => e.category)));

      cats.forEach(cat => {
        const catItems = filtered.filter(e => e.category === cat);
        const group = document.createElement('div');
        group.className = 'category-group';

        const title = document.createElement('div');
        title.className = 'cat-title';
        title.innerHTML = '<span>' + cat + '</span><span>' + catItems.length + '</span>';
        group.appendChild(title);

        catItems.forEach(item => {
          const div = document.createElement('div');
          div.className = 'email-item' + (item.id === currentId ? ' active' : '');
          div.onclick = () => selectEmail(item.id);
          div.innerHTML = `
            <div class="email-item-title">${item.title}</div>
            <div class="email-item-meta">
              <span class="role-badge role-${item.role}">${item.role}</span>
              <span style="color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;">${item.subject}</span>
            </div>
          `;
          group.appendChild(div);
        });

        container.appendChild(group);
      });
    }

    function selectEmail(id) {
      currentId = id;
      const email = emailsData.find(e => e.id === id);
      if (!email) return;

      document.querySelectorAll('.email-item').forEach(el => el.classList.remove('active'));
      renderSidebar(getFilteredList());

      // Update Meta
      document.getElementById('disp-subject').textContent = email.subject;
      document.getElementById('disp-to').textContent = email.to;
      document.getElementById('disp-from').textContent = email.from;
      document.getElementById('disp-trigger').textContent = email.trigger;
      document.getElementById('btn-open-tab').href = email.fileName;

      // Update Frame
      document.getElementById('preview-frame').src = email.fileName;
      document.getElementById('code-view').textContent = email.rawHtml;

      if (isCodeMode) {
        document.getElementById('iframe-wrap').style.display = 'none';
        document.getElementById('code-view').style.display = 'block';
      } else {
        document.getElementById('iframe-wrap').style.display = 'flex';
        document.getElementById('code-view').style.display = 'none';
      }
    }

    function setDevice(device) {
      const wrap = document.getElementById('iframe-wrap');
      wrap.className = 'iframe-wrapper ' + device;
      document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + device).classList.add('active');
    }

    function toggleCodeView() {
      isCodeMode = !isCodeMode;
      const btn = document.getElementById('btn-toggle-code');
      btn.textContent = isCodeMode ? 'View Visual' : 'View HTML';
      btn.classList.toggle('primary', isCodeMode);

      document.getElementById('iframe-wrap').style.display = isCodeMode ? 'none' : 'flex';
      document.getElementById('code-view').style.display = isCodeMode ? 'block' : 'none';
    }

    function copyCurrentHtml() {
      const email = emailsData.find(e => e.id === currentId);
      if (!email) return;
      navigator.clipboard.writeText(email.rawHtml).then(() => {
        showToast('HTML copied to clipboard!');
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function getFilteredList() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      if (!q) return emailsData;
      return emailsData.filter(e => 
        e.title.toLowerCase().includes(q) || 
        e.subject.toLowerCase().includes(q) || 
        e.category.toLowerCase().includes(q) || 
        e.role.toLowerCase().includes(q) || 
        e.to.toLowerCase().includes(q)
      );
    }

    function filterEmails() {
      renderSidebar(getFilteredList());
    }

    // Init
    renderSidebar();
    selectEmail(currentId);
  </script>
